name: Build and Release SysInitPro

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Setup UAC Manifest and Build Windows EXE
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          if (Test-Path go.sum) { go mod download } else { go mod tidy }
          New-Item -ItemType Directory -Force -Path "build/windows" | Out-Null
          $xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0"><trustInfo xmlns="urn:schemas-microsoft-com:asm.v3"><security><requestedPrivileges><requestedExecutionLevel level="requireAdministrator" uiAccess="false"/></requestedPrivileges></security></trustInfo></assembly>'
          [System.IO.File]::WriteAllText("build/windows/wails.exe.manifest", $xml)
          wails build -platform windows/amd64 -webview2 download
          Rename-Item -Path "build/bin/SysInitPro.exe" -NewName "SysInitPro-Windows-amd64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: SysInitPro-Windows
          path: build/bin/SysInitPro-Windows-amd64.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Install WebKit2GTK 4.1 & Build Linux Binary
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          [ -f go.sum ] && go mod download || go mod tidy
          wails build -platform linux/amd64 -tags webkit2_41
          mv build/bin/SysInitPro build/bin/SysInitPro-Linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: SysInitPro-Linux
          path: build/bin/SysInitPro-Linux-amd64

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build macOS Universal App
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
          [ -f go.sum ] && go mod download || go mod tidy
          wails build -platform darwin/universal
          cd build/bin && zip -r SysInitPro-macOS-universal.zip SysInitPro.app
      - uses: actions/upload-artifact@v4
        with:
          name: SysInitPro-macOS
          path: build/bin/SysInitPro-macOS-universal.zip

  publish-release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Categorized Release Notes
        shell: bash
        run: |
          CUR_TAG="${GITHUB_REF_NAME:-v10.0.0}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${CUR_TAG}^" 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:"%s (%h)" --no-merges > commits.txt
          else
            git log -n 30 --pretty=format:"%s (%h)" --no-merges > commits.txt
          fi

          {
            echo "## 🚀 SysInitPro ${CUR_TAG}"
            echo ""

            append_cat() {
              local title="$1"
              local pattern="$2"
              local matches
              matches=$(grep -E "$pattern" commits.txt || true)
              if [ -n "$matches" ]; then
                echo "### ${title}"
                echo "$matches" | sed 's/^/- /'
                echo ""
              fi
            }

            append_cat "✨ 新特性" "^feat(\([^)]+\))?!?: "
            append_cat "🐛 问题修复" "^fix(\([^)]+\))?!?: "
            append_cat "⚡ 性能优化与重构" "^(perf|refactor)(\([^)]+\))?!?: "
            append_cat "📚 文档与界面调整" "^(docs|style)(\([^)]+\))?!?: "
            append_cat "🔧 工程维护与构建" "^(ci|chore|build|test|release)(\([^)]+\))?!?: "

            OTHER=$(grep -Ev "^(feat|fix|perf|refactor|docs|style|ci|chore|build|test|release)(\([^)]+\))?!?: " commits.txt || true)
            if [ -n "$OTHER" ]; then
              echo "### 📝 其他变更"
              echo "$OTHER" | sed 's/^/- /'
              echo ""
            fi

            echo "### 📦 平台产物"
            echo "- **Windows (amd64)**: \`SysInitPro-Windows-amd64.exe\`"
            echo "- **Linux (amd64)**: \`SysInitPro-Linux-amd64\`"
            echo "- **macOS (Universal)**: \`SysInitPro-macOS-universal.zip\`"
          } > release_notes.md

      - name: Publish All Platforms to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v10.0.0' }}
          name: SysInitPro ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v10.0.0' }}
          body_path: release_notes.md
          generate_release_notes: true
          files: |
            artifacts/SysInitPro-Windows/SysInitPro-Windows-amd64.exe
            artifacts/SysInitPro-Linux/SysInitPro-Linux-amd64
            artifacts/SysInitPro-macOS/SysInitPro-macOS-universal.zip